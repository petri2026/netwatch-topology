<svg width="256" height="256" viewBox="0 0 256 256" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#132741"/>
      <stop offset="1" stop-color="#0b1424"/>
    </linearGradient>
    <linearGradient id="ac" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#22d3ee" flood-opacity="0.28"/>
    </filter>
  </defs>

  <!-- app tile -->
  <rect x="16" y="16" width="224" height="224" rx="52" fill="url(#bg)"/>
  <rect x="16" y="16" width="224" height="224" rx="52" fill="none" stroke="url(#ac)" stroke-width="6" opacity="0.9"/>

  <!-- network node container -->
  <rect x="60" y="60" width="136" height="136" rx="30" fill="#0d1b2e" stroke="url(#ac)" stroke-width="7"/>

  <!-- ascending bar chart (analytics) -->
  <g filter="url(#sh)">
    <rect x="86"  y="132" width="20" height="40" rx="6" fill="url(#ac)"/>
    <rect x="118" y="112" width="20" height="60" rx="6" fill="url(#ac)"/>
    <rect x="150" y="88"  width="20" height="84" rx="6" fill="url(#ac)"/>
  </g>

  <!-- live signal node -->
  <circle cx="160" cy="72" r="13" fill="#10b981"/>
  <circle cx="160" cy="72" r="13" fill="none" stroke="#0b1424" stroke-width="3"/>
</svg>
